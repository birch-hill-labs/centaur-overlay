[project]
name = "slack"
description = "Search Slack messages, channels, threads, users"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "slack-sdk>=3.27.0",
    "typer>=0.12.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "structlog>=24.4.0",
]

[project.scripts]
slack = "centaur_tool_slack.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "centaur_tool_slack"

[tool.centaur]
module = "client.py"
description = "Post and read messages in Birch Hill's Slack. Primary use: the bd-call-note fan-out — send_message posts the full call note to #bd-intake and a per-deal slice to each #deal-* / #partnership-* channel (resolve the channel from the deal/partner card's slack_channel field, or list_channels by name). Also search_messages / get_channel_history / list_users. Posting only; this tool does NOT create channels — if the target channel doesn't exist, flag it for a human to create. Credential is injected at the tool layer (iron-proxy); never shell out to the Slack API from the sandbox."
secrets = [
    {type = "http", name = "SLACK_BOT_TOKEN", match_headers = ["Authorization"], hosts = ["slack.com"]},
]
optional_secrets = [
    {type = "http", name = "SLACK_SEARCH_TOKEN", match_headers = ["Authorization"], hosts = ["slack.com"]},
    {type = "http", name = "SLACK_ETL_TOKEN", match_headers = ["Authorization"], hosts = ["slack.com", "files.slack.com"]},
]
