[project]
name = "obsidian-vault"
version = "0.1.0"
description = "Read Birch Hill's institutional knowledge from the obsidian-vault GitHub repo"
requires-python = ">=3.11"
license = "Apache-2.0 OR MIT"
dependencies = ["httpx>=0.28.0"]

# Registration marker: install-tool-shims (base image >= sha-bc4a1e4) only shims
# a tool when its pyproject declares a [project.scripts] entry. The value is
# never executed — execution routes through [tool.centaur].module (client.py) —
# but the script NAME is the tool name the agent invokes, so it must stay
# "obsidian_vault".
[project.scripts]
obsidian_vault = "client:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# This image's `centaur-tools run` builds the tool's wheel (uv + hatchling) before
# importing client.py. The flat layout (client.py + __init__.py at the tool root)
# gives hatchling nothing to package by default, so the build — and every tool
# call — fails. Ship the tool dir as a package, remapped to the import name.
[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.wheel.sources]
"." = "obsidian_vault"

[tool.centaur]
module = "client.py"
description = "Read, list, search, and tree the Birch Hill obsidian-vault (markdown files of institutional knowledge: counterparty briefs, atlas/rwasp workbench, daily notes, knowledge graph, onboarding docs)."
# Iron-proxy injects GITHUB_VAULT_TOKEN as an Authorization Bearer header
# on outbound requests to api.github.com so the tool can read birch-hill-labs/obsidian-vault.
# Token is a GitHub PAT with `repo` (or fine-grained `contents:read`) scoped to that single repo.
secrets = [
  {type = "http", name = "GITHUB_VAULT_TOKEN", match_headers = ["Authorization"], hosts = ["api.github.com"]},
]
